<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Ledger — Decision Journal</title>
<style>
  :root{
    --bg:#14171c;
    --surface:#1b1f26;
    --surface2:#232830;
    --ink:#e9e4d8;
    --ink-dim:#a9a79c;
    --border:#333944;
    --accent:#c9a227;
    --accent-ink:#14171c;
    --accent2:#4c7a73;
    --danger:#b5533c;
    --radius:7px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;
    font-size:14px;
    line-height:1.5;
  }
  .serif{ font-family:Georgia,"Iowan Old Style","Palatino Linotype","Book Antiqua",serif; }
  .mono{ font-family:"IBM Plex Mono","SF Mono",Menlo,Consolas,monospace; letter-spacing:.02em; }

  #app{ min-height:100vh; }

  input,textarea,select{
    background:var(--surface2);
    border:1px solid var(--border);
    color:var(--ink);
    border-radius:5px;
    padding:9px 10px;
    font-family:inherit;
    font-size:13.5px;
    width:100%;
    outline:none;
  }
  input:focus,textarea:focus,select:focus{ border-color:var(--accent); }
  textarea{ resize:vertical; min-height:64px; }
  label{ display:block; font-size:11.5px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.06em; margin:0 0 4px; }
  .field{ margin-bottom:12px; }
  .row{ display:flex; gap:10px; flex-wrap:wrap; }
  .row > .field{ flex:1; min-width:120px; }

  button{
    font-family:inherit; cursor:pointer; border-radius:5px; border:1px solid var(--border);
    background:var(--surface2); color:var(--ink); padding:9px 14px; font-size:13px;
  }
  button:hover{ border-color:var(--accent); }
  button.primary{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600; }
  button.primary:hover{ filter:brightness(1.08); }
  button.ghost{ background:transparent; }
  button.danger{ color:var(--danger); border-color:var(--danger); background:transparent; }
  button:disabled{ opacity:.5; cursor:default; }
  button.sm{ padding:5px 10px; font-size:12px; }
  a.navlink{ color:var(--ink-dim); text-decoration:none; font-size:12px; }
  a.navlink:hover{ color:var(--ink); }

  .shell{ display:flex; min-height:100vh; }
  .sidebar{
    width:210px; flex:none; background:var(--surface); border-right:1px solid var(--border);
    padding:22px 14px; display:flex; flex-direction:column;
  }
  .brand{ padding:0 8px 20px; }
  .brand .mark{ color:var(--accent); font-size:12px; letter-spacing:.12em; text-transform:uppercase; }
  .brand h1{ font-size:19px; margin:4px 0 0; }
  .navbtn{
    display:block; width:100%; text-align:left; background:transparent; border:none;
    color:var(--ink-dim); padding:10px 10px; border-radius:5px; font-size:13.5px; margin-bottom:2px;
  }
  .navbtn:hover{ background:var(--surface2); color:var(--ink); border:none; }
  .navbtn.active{ background:var(--surface2); color:var(--accent); font-weight:600; border:none; }
  .sidebar-foot{ margin-top:auto; padding-top:14px; }

  .main{ flex:1; padding:28px 34px 60px; max-width:920px; }
  .pagehead{ margin-bottom:22px; }
  .pagehead h2{ font-size:22px; margin:0 0 3px; }
  .pagehead p{ color:var(--ink-dim); margin:0; font-size:13px; }

  .card{ position:relative; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; margin-bottom:12px; }
  .stamp{
    position:absolute; top:-9px; right:14px; background:var(--accent); color:var(--accent-ink);
    font-size:10.5px; padding:2px 8px; border-radius:2px; transform:rotate(-2.5deg);
    box-shadow:0 2px 5px rgba(0,0,0,.4); font-weight:700;
  }
  .stamp.teal{ background:var(--accent2); color:#0e1613; }

  .task-head{ display:flex; align-items:center; justify-content:space-between; cursor:pointer; gap:10px; }
  .task-head .name{ font-size:14.5px; font-weight:600; }
  .task-meta{ display:flex; gap:8px; align-items:center; font-size:11.5px; color:var(--ink-dim); }
  .pill{ background:var(--surface2); border:1px solid var(--border); border-radius:20px; padding:2px 9px; font-size:11px; }
  .task-body{ margin-top:14px; padding-top:14px; border-top:1px solid var(--border); }

  .divider{ border:none; border-top:1px solid var(--border); margin:22px 0; }
  .empty{ color:var(--ink-dim); font-size:13px; padding:18px 0; text-align:center; border:1px dashed var(--border); border-radius:var(--radius); }

  .bar-row{ display:flex; align-items:center; gap:10px; margin-bottom:9px; font-size:12.5px; }
  .bar-label{ width:110px; flex:none; color:var(--ink-dim); }
  .bar-track{ flex:1; background:var(--surface2); border-radius:4px; height:10px; overflow:hidden; }
  .bar-fill{ height:100%; background:var(--accent); }
  .bar-val{ width:34px; text-align:right; flex:none; color:var(--ink-dim); }

  .toast{ position:fixed; bottom:20px; right:20px; background:var(--surface2); border:1px solid var(--accent); color:var(--ink); padding:10px 16px; border-radius:6px; font-size:12.5px; z-index:50; }

  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:22px; }
  .stat{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; }
  .stat .num{ font-size:24px; font-family:Georgia,serif; color:var(--accent); }
  .stat .lbl{ font-size:11px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.06em; margin-top:2px; }

  textarea.export{ min-height:340px; font-family:"IBM Plex Mono","SF Mono",Menlo,Consolas,monospace; font-size:12px; white-space:pre; }

  @media (max-width:760px){
    .shell{ flex-direction:column; }
    .sidebar{ width:100%; flex-direction:row; align-items:center; padding:12px; overflow-x:auto; }
    .brand{ padding:0 12px 0 4px; flex:none; }
    .navbtn{ white-space:nowrap; width:auto; }
    .sidebar-foot{ margin-top:0; margin-left:auto; padding-top:0; }
    .main{ padding:20px 16px 60px; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------------- STORAGE (Workers KV via /api/kv) ---------------- */
const Storage = {
  async get(key){
    const r = await fetch('/api/kv?key=' + encodeURIComponent(key));
    if(r.status === 404) return null;
    if(!r.ok) throw new Error('kv get failed: ' + r.status);
    return r.json(); // { key, value }
  },
  async set(key, value){
    const r = await fetch('/api/kv', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ key, value })
    });
    if(!r.ok) throw new Error('kv set failed: ' + r.status);
    return r.json();
  },
  async delete(key){
    const r = await fetch('/api/kv?key=' + encodeURIComponent(key), { method:'DELETE' });
    if(!r.ok) throw new Error('kv delete failed: ' + r.status);
    return r.json();
  },
  async list(prefix){
    const r = await fetch('/api/kv?list=' + encodeURIComponent(prefix || ''));
    if(!r.ok) throw new Error('kv list failed: ' + r.status);
    return r.json(); // { keys: [...] }
  }
};

const app = document.getElementById('app');

let state = {
  tab: 'today',
  currentDate: todayStr(),
  journal: null,
  decisions: [],
  ideas: [],
  loadedDecisions: false,
  loadedIdeas: false,
  exportText: ''
};

function todayStr(){ return new Date().toISOString().slice(0,10); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2200);
}

/* ---------------- DATA LOADING ---------------- */
async function loadJournal(date){
  try{
    const r = await Storage.get('journal:'+date);
    state.journal = r && r.value ? JSON.parse(r.value) : emptyJournal(date);
  }catch(e){
    state.journal = emptyJournal(date);
  }
}
function emptyJournal(date){
  return { date, mood:'', energy:'', location:'', weather:'', goal:'', tasks:[], reflection:'' };
}
async function saveJournal(){
  try{ await Storage.set('journal:'+state.journal.date, JSON.stringify(state.journal)); }
  catch(e){ toast('Save failed — check connection.'); }
}

async function loadDecisions(){
  if(state.loadedDecisions) return;
  try{
    const r = await Storage.get('decisions');
    state.decisions = r && r.value ? JSON.parse(r.value) : [];
  }catch(e){ state.decisions = []; }
  state.loadedDecisions = true;
}
async function saveDecisions(){
  try{ await Storage.set('decisions', JSON.stringify(state.decisions)); }
  catch(e){ toast('Save failed — check connection.'); }
}

async function loadIdeas(){
  if(state.loadedIdeas) return;
  try{
    const r = await Storage.get('ideas');
    state.ideas = r && r.value ? JSON.parse(r.value) : [];
  }catch(e){ state.ideas = []; }
  state.loadedIdeas = true;
}
async function saveIdeas(){
  try{ await Storage.set('ideas', JSON.stringify(state.ideas)); }
  catch(e){ toast('Save failed — check connection.'); }
}

/* ---------------- BOOT / SHELL ---------------- */
async function boot(){
  await loadJournal(state.currentDate);
  renderApp();
}

function renderApp(){
  app.innerHTML = `
    <div class="shell">
      <div class="sidebar">
        <div class="brand">
          <div class="mark mono">LEDGER</div>
          <h1 class="serif">Decision<br/>Journal</h1>
        </div>
        <button class="navbtn ${state.tab==='today'?'active':''}" onclick="switchTab('today')">Today</button>
        <button class="navbtn ${state.tab==='decisions'?'active':''}" onclick="switchTab('decisions')">Decisions</button>
        <button class="navbtn ${state.tab==='ideas'?'active':''}" onclick="switchTab('ideas')">Ideas &amp; Frustrations</button>
        <button class="navbtn ${state.tab==='insights'?'active':''}" onclick="switchTab('insights')">Insights</button>
        <button class="navbtn ${state.tab==='export'?'active':''}" onclick="switchTab('export')">Export</button>
        <div class="sidebar-foot">
          <a class="navlink" href="/cdn-cgi/access/logout">Sign out</a>
        </div>
      </div>
      <div class="main" id="main"></div>
    </div>`;
  renderTab();
}

async function switchTab(tab){
  state.tab = tab;
  if(tab==='decisions') await loadDecisions();
  if(tab==='ideas') await loadIdeas();
  renderApp();
}

function renderTab(){
  const main = document.getElementById('main');
  if(state.tab==='today') main.innerHTML = todayTabHTML();
  else if(state.tab==='decisions') main.innerHTML = decisionsTabHTML();
  else if(state.tab==='ideas') main.innerHTML = ideasTabHTML();
  else if(state.tab==='insights') main.innerHTML = insightsTabHTML();
  else if(state.tab==='export') main.innerHTML = exportTabHTML();
}

/* ---------------- TODAY TAB ---------------- */
function todayTabHTML(){
  const j = state.journal;
  const tasks = j.tasks || [];
  return `
    <div class="pagehead">
      <h2 class="serif">Today's entry</h2>
      <p>Capture the day. No forms to fill blindly — just what happened.</p>
    </div>

    <div class="card">
      <div class="row">
        <div class="field"><label>Date</label>
          <input type="date" value="${j.date}" onchange="changeDate(this.value)"/>
        </div>
        <div class="field"><label>Mood</label>
          <input value="${esc(j.mood)}" placeholder="e.g. focused" onblur="updateJournalField('mood',this.value)"/>
        </div>
        <div class="field"><label>Energy</label>
          <input value="${esc(j.energy)}" placeholder="e.g. 7/10" onblur="updateJournalField('energy',this.value)"/>
        </div>
      </div>
      <div class="row">
        <div class="field"><label>Location</label>
          <input value="${esc(j.location)}" onblur="updateJournalField('location',this.value)"/>
        </div>
        <div class="field"><label>Weather</label>
          <input value="${esc(j.weather)}" onblur="updateJournalField('weather',this.value)"/>
        </div>
      </div>
      <div class="field"><label>Today's goal</label>
        <input value="${esc(j.goal)}" placeholder="The one thing that matters most today" onblur="updateJournalField('goal',this.value)"/>
      </div>
    </div>

    <hr class="divider"/>

    <div class="card">
      <label>What are you planning to do today?</label>
      <textarea id="task-dump" placeholder="Write freely — e.g. renew passport, buy groceries, finish the proposal, call Rahul..."></textarea>
      <div style="display:flex; gap:8px; margin-top:8px;">
        <button class="primary" onclick="extractTasks()" id="extract-btn">✦ Extract tasks with AI</button>
        <button class="ghost" onclick="addTaskManual()">+ Add task manually</button>
      </div>
      <div id="extract-err" style="color:var(--danger); font-size:12px; margin-top:6px;"></div>
    </div>

    <div id="task-list">${tasks.map(taskCardHTML).join('') || '<div class="empty">No tasks yet today.</div>'}</div>

    <hr class="divider"/>
    <div class="card">
      <label>Reflection</label>
      <textarea placeholder="How did the day go? What would you do differently?" onblur="updateJournalField('reflection',this.value)">${esc(j.reflection)}</textarea>
    </div>
  `;
}

function taskCardHTML(t){
  return `
    <div class="card">
      <div class="stamp mono">${esc(t.category||'TASK')}</div>
      <div class="task-head" onclick="toggleTask('${t.id}')">
        <div class="name">${esc(t.name)||'(untitled task)'}</div>
        <div class="task-meta">
          <span class="pill">${esc(t.priority)||'—'}</span>
          <span class="pill">${esc(t.status)||'Not started'}</span>
          <span>${t.expanded?'▾':'▸'}</span>
        </div>
      </div>
      ${t.expanded ? taskBodyHTML(t) : ''}
    </div>`;
}

function taskBodyHTML(t){
  return `
    <div class="task-body">
      <div class="row">
        <div class="field"><label>Task name</label>
          <input value="${esc(t.name)}" onblur="updateTaskField('${t.id}','name',this.value)"/>
        </div>
        <div class="field"><label>Category</label>
          <input value="${esc(t.category)}" onblur="updateTaskField('${t.id}','category',this.value)"/>
        </div>
      </div>
      <div class="field"><label>Why do you want to do this? (Reason)</label>
        <input value="${esc(t.reason)}" onblur="updateTaskField('${t.id}','reason',this.value)"/>
      </div>
      <div class="row">
        <div class="field"><label>Need or want?</label>
          <select onchange="updateTaskField('${t.id}','needWant',this.value)">
            <option ${t.needWant==='Need'?'selected':''}>Need</option>
            <option ${t.needWant==='Want'?'selected':''}>Want</option>
          </select>
        </div>
        <div class="field"><label>Priority</label>
          <select onchange="updateTaskField('${t.id}','priority',this.value)">
            <option ${t.priority==='High'?'selected':''}>High</option>
            <option ${t.priority==='Medium'?'selected':''}>Medium</option>
            <option ${t.priority==='Low'?'selected':''}>Low</option>
          </select>
        </div>
        <div class="field"><label>Deadline</label>
          <input type="date" value="${esc(t.deadline)}" onchange="updateTaskField('${t.id}','deadline',this.value)"/>
        </div>
      </div>
      <div class="row">
        <div class="field"><label>Estimated time</label>
          <input value="${esc(t.estTime)}" placeholder="e.g. 2h" onblur="updateTaskField('${t.id}','estTime',this.value)"/>
        </div>
        <div class="field"><label>Estimated cost</label>
          <input value="${esc(t.estCost)}" placeholder="e.g. ₹500" onblur="updateTaskField('${t.id}','estCost',this.value)"/>
        </div>
        <div class="field"><label>Status</label>
          <select onchange="updateTaskField('${t.id}','status',this.value)">
            <option ${t.status==='Not started'?'selected':''}>Not started</option>
            <option ${t.status==='In progress'?'selected':''}>In progress</option>
            <option ${t.status==='Done'?'selected':''}>Done</option>
            <option ${t.status==='Dropped'?'selected':''}>Dropped</option>
          </select>
        </div>
      </div>
      <div class="field"><label>Resources needed</label>
        <input value="${esc(t.resources)}" onblur="updateTaskField('${t.id}','resources',this.value)"/>
      </div>
      <div class="field"><label>Alternatives considered</label>
        <input value="${esc(t.alternatives)}" onblur="updateTaskField('${t.id}','alternatives',this.value)"/>
      </div>
      <div class="field"><label>Risks</label>
        <input value="${esc(t.risks)}" onblur="updateTaskField('${t.id}','risks',this.value)"/>
      </div>
      <div class="field"><label>Outcome</label>
        <input value="${esc(t.outcome)}" placeholder="Filled in once done" onblur="updateTaskField('${t.id}','outcome',this.value)"/>
      </div>
      <button class="danger sm" onclick="deleteTask('${t.id}')">Delete task</button>
    </div>`;
}

function changeDate(d){
  saveJournal().then(()=>{
    state.currentDate = d;
    loadJournal(d).then(renderApp);
  });
}
function updateJournalField(field,val){
  state.journal[field] = val;
  saveJournal();
}
function addTaskManual(){
  state.journal.tasks = state.journal.tasks || [];
  state.journal.tasks.push({ id:uid(), name:'New task', category:'Other', reason:'', needWant:'Want', priority:'Medium', deadline:'', estTime:'', estCost:'', resources:'', alternatives:'', risks:'', status:'Not started', outcome:'', expanded:true });
  saveJournal();
  renderTab();
}
function toggleTask(id){
  const t = state.journal.tasks.find(x=>x.id===id);
  t.expanded = !t.expanded;
  renderTab();
}
function updateTaskField(id, field, val){
  const t = state.journal.tasks.find(x=>x.id===id);
  t[field] = val;
  saveJournal();
  if(field==='name' || field==='category' || field==='priority' || field==='status') renderTab();
}
function deleteTask(id){
  state.journal.tasks = state.journal.tasks.filter(x=>x.id!==id);
  saveJournal();
  renderTab();
}

async function extractTasks(){
  const text = document.getElementById('task-dump').value.trim();
  const errEl = document.getElementById('extract-err');
  const btn = document.getElementById('extract-btn');
  errEl.textContent = '';
  if(!text){ errEl.textContent = 'Write something first.'; return; }
  btn.disabled = true; btn.textContent = 'Extracting…';
  try{
    const prompt =
      'Extract a JSON array of discrete tasks from the text below. ' +
      'Each item must be an object: {"name": string, "category": one of ["Errand","Work","Health","Finance","Social","Home","Learning","Other"]}. ' +
      'Return ONLY the JSON array — no markdown fences, no preamble, no explanation.\n\n' +
      'Today\'s stated goal: ' + (state.journal.goal || 'none stated') + '\n' +
      'Text: ' + text;

    const resp = await fetch('/api/extract', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ prompt })
    });
    const data = await resp.json();
    if(!resp.ok) throw new Error(data.error || 'extract failed');
    const textOut = (data.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('');
    const clean = textOut.replace(/```json|```/g,'').trim();
    const items = JSON.parse(clean);
    state.journal.tasks = state.journal.tasks || [];
    items.forEach(it=>{
      state.journal.tasks.push({ id:uid(), name: it.name||'Untitled', category: it.category||'Other', reason:'', needWant:'Want', priority:'Medium', deadline:'', estTime:'', estCost:'', resources:'', alternatives:'', risks:'', status:'Not started', outcome:'', expanded:false });
    });
    await saveJournal();
    document.getElementById('task-dump').value = '';
    renderTab();
    toast(`Added ${items.length} task${items.length===1?'':'s'}.`);
  }catch(e){
    errEl.textContent = 'Could not extract tasks. Try again, or add manually.';
  }
  btn.disabled = false; btn.textContent = '✦ Extract tasks with AI';
}

/* ---------------- DECISIONS TAB ---------------- */
function decisionsTabHTML(){
  const list = state.decisions.slice().sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''));
  return `
    <div class="pagehead">
      <h2 class="serif">Decisions</h2>
      <p>Not every choice is a task. Should you buy the car? Hire someone? Quit the job?</p>
    </div>
    <button class="primary" onclick="addDecision()">+ New decision</button>
    <div style="margin-top:16px;">
      ${list.map(decisionCardHTML).join('') || '<div class="empty">No decisions logged yet.</div>'}
    </div>`;
}
function decisionCardHTML(d){
  return `
    <div class="card">
      <div class="stamp teal mono">${esc(d.createdAt||'')}</div>
      <div class="task-head" onclick="toggleDecision('${d.id}')">
        <div class="name">${esc(d.decision)||'(untitled decision)'}</div>
        <div class="task-meta"><span class="pill">Confidence ${esc(d.confidence)||'—'}/5</span><span>${d.expanded?'▾':'▸'}</span></div>
      </div>
      ${d.expanded ? `
      <div class="task-body">
        <div class="field"><label>Decision</label><input value="${esc(d.decision)}" onblur="updateDecisionField('${d.id}','decision',this.value)"/></div>
        <div class="field"><label>Context</label><textarea onblur="updateDecisionField('${d.id}','context',this.value)">${esc(d.context)}</textarea></div>
        <div class="row">
          <div class="field"><label>Options considered</label><textarea onblur="updateDecisionField('${d.id}','options',this.value)">${esc(d.options)}</textarea></div>
        </div>
        <div class="row">
          <div class="field"><label>Pros</label><textarea onblur="updateDecisionField('${d.id}','pros',this.value)">${esc(d.pros)}</textarea></div>
          <div class="field"><label>Cons</label><textarea onblur="updateDecisionField('${d.id}','cons',this.value)">${esc(d.cons)}</textarea></div>
        </div>
        <div class="row">
          <div class="field"><label>Expected outcome</label><input value="${esc(d.expectedOutcome)}" onblur="updateDecisionField('${d.id}','expectedOutcome',this.value)"/></div>
          <div class="field"><label>Actual outcome</label><input value="${esc(d.actualOutcome)}" onblur="updateDecisionField('${d.id}','actualOutcome',this.value)"/></div>
        </div>
        <div class="row">
          <div class="field"><label>Confidence (1-5)</label><input value="${esc(d.confidence)}" onblur="updateDecisionField('${d.id}','confidence',this.value)"/></div>
          <div class="field"><label>Money impact</label><input value="${esc(d.moneyImpact)}" onblur="updateDecisionField('${d.id}','moneyImpact',this.value)"/></div>
          <div class="field"><label>Time impact</label><input value="${esc(d.timeImpact)}" onblur="updateDecisionField('${d.id}','timeImpact',this.value)"/></div>
        </div>
        <div class="field"><label>People consulted</label><input value="${esc(d.peopleConsulted)}" onblur="updateDecisionField('${d.id}','peopleConsulted',this.value)"/></div>
        <div class="field"><label>Lessons</label><textarea onblur="updateDecisionField('${d.id}','lessons',this.value)">${esc(d.lessons)}</textarea></div>
        <button class="danger sm" onclick="deleteDecision('${d.id}')">Delete decision</button>
      </div>` : ''}
    </div>`;
}
function addDecision(){
  state.decisions.push({ id:uid(), createdAt: todayStr(), decision:'New decision', context:'', options:'', pros:'', cons:'', expectedOutcome:'', actualOutcome:'', confidence:'', moneyImpact:'', timeImpact:'', peopleConsulted:'', lessons:'', expanded:true });
  saveDecisions(); renderTab();
}
function toggleDecision(id){ const d=state.decisions.find(x=>x.id===id); d.expanded=!d.expanded; renderTab(); }
function updateDecisionField(id, field, val){
  const d = state.decisions.find(x=>x.id===id);
  d[field]=val; saveDecisions();
  if(field==='decision') renderTab();
}
function deleteDecision(id){ state.decisions = state.decisions.filter(x=>x.id!==id); saveDecisions(); renderTab(); }

/* ---------------- IDEAS TAB ---------------- */
function ideasTabHTML(){
  const list = state.ideas.slice().sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''));
  return `
    <div class="pagehead">
      <h2 class="serif">Ideas &amp; Frustrations</h2>
      <p>"I wish there was an easier way..." — every frustration is a startup opportunity in disguise.</p>
    </div>
    <div class="card">
      <div class="row">
        <div class="field"><label>Type</label>
          <select id="idea-type"><option>Startup idea</option><option>Frustration</option><option>Repeated pattern</option></select>
        </div>
        <div class="field"><label>Frequency</label>
          <input id="idea-freq" placeholder="e.g. 3x this week"/>
        </div>
      </div>
      <div class="field"><label>Problem / observation</label>
        <textarea id="idea-problem" placeholder="What's annoying, repeated, or missing?"></textarea>
      </div>
      <div class="field"><label>Notes</label>
        <textarea id="idea-notes" placeholder="Who else has this problem? Possible product? Market?"></textarea>
      </div>
      <button class="primary" onclick="addIdea()">+ Save</button>
    </div>
    <div>${list.map(ideaCardHTML).join('') || '<div class="empty">Nothing captured yet.</div>'}</div>
  `;
}
function ideaCardHTML(i){
  return `
    <div class="card">
      <div class="stamp mono">${esc(i.type||'IDEA')}</div>
      <div class="task-head">
        <div class="name">${esc(i.problem)||'(untitled)'}</div>
        <div class="task-meta"><span class="pill">${esc(i.frequency)||'—'}</span></div>
      </div>
      ${i.notes ? `<div class="task-body">${esc(i.notes)}</div>` : ''}
      <div style="margin-top:10px;"><button class="danger sm" onclick="deleteIdea('${i.id}')">Delete</button></div>
    </div>`;
}
function addIdea(){
  const type = document.getElementById('idea-type').value;
  const freq = document.getElementById('idea-freq').value;
  const problem = document.getElementById('idea-problem').value.trim();
  const notes = document.getElementById('idea-notes').value.trim();
  if(!problem){ toast('Describe the problem first.'); return; }
  state.ideas.push({ id:uid(), createdAt: todayStr(), type, frequency:freq, problem, notes });
  saveIdeas(); renderTab();
}
function deleteIdea(id){ state.ideas = state.ideas.filter(x=>x.id!==id); saveIdeas(); renderTab(); }

/* ---------------- INSIGHTS TAB ---------------- */
async function insightsData(){
  const r = await Storage.list('journal:');
  const keys = (r && r.keys) || [];
  const journals = [];
  for(const k of keys){
    try{ const rr = await Storage.get(k); if(rr && rr.value) journals.push(JSON.parse(rr.value)); }catch(e){}
  }
  return journals;
}
function insightsTabHTML(){
  insightsRender();
  return `
    <div class="pagehead">
      <h2 class="serif">Insights</h2>
      <p>What the ledger notices, without needing AI.</p>
    </div>
    <div id="insights-body">
      <div class="empty">Loading…</div>
    </div>
  `;
}
async function insightsRender(){
  const journals = await insightsData();
  const el = document.getElementById('insights-body');
  if(!el) return;
  const allTasks = journals.flatMap(j=>j.tasks||[]);
  const total = allTasks.length;
  const done = allTasks.filter(t=>t.status==='Done').length;
  const byCat = {};
  allTasks.forEach(t=>{ const c=t.category||'Other'; byCat[c]=(byCat[c]||0)+1; });
  const catEntries = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const maxCat = Math.max(1, ...catEntries.map(e=>e[1]));

  el.innerHTML = `
    <div class="stat-grid">
      <div class="stat"><div class="num mono">${journals.length}</div><div class="lbl">Days logged</div></div>
      <div class="stat"><div class="num mono">${total}</div><div class="lbl">Tasks captured</div></div>
      <div class="stat"><div class="num mono">${total? Math.round(done/total*100):0}%</div><div class="lbl">Completion rate</div></div>
      <div class="stat"><div class="num mono">${state.decisions.length}</div><div class="lbl">Decisions logged</div></div>
    </div>
    <div class="card">
      <label style="margin-bottom:12px;">Tasks by category</label>
      ${catEntries.length ? catEntries.map(([cat,n])=>`
        <div class="bar-row">
          <div class="bar-label">${esc(cat)}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${n/maxCat*100}%"></div></div>
          <div class="bar-val mono">${n}</div>
        </div>`).join('') : '<div class="empty">Not enough data yet.</div>'}
    </div>
  `;
}

/* ---------------- EXPORT TAB ---------------- */
function exportTabHTML(){
  const today = todayStr();
  const weekAgo = new Date(Date.now() - 7*86400000).toISOString().slice(0,10);
  return `
    <div class="pagehead">
      <h2 class="serif">Export for AI analysis</h2>
      <p>Compile your ledger into one prompt, then paste it into Claude or ChatGPT.</p>
    </div>
    <div class="card">
      <div class="row">
        <div class="field"><label>From</label><input type="date" id="exp-from" value="${weekAgo}"/></div>
        <div class="field"><label>To</label><input type="date" id="exp-to" value="${today}"/></div>
      </div>
      <button class="primary" onclick="generateExport()">Generate export</button>
    </div>
    <div id="export-out"></div>
  `;
}
async function generateExport(){
  const from = document.getElementById('exp-from').value;
  const to = document.getElementById('exp-to').value;
  const out = document.getElementById('export-out');
  out.innerHTML = '<div class="empty">Compiling…</div>';

  const r = await Storage.list('journal:');
  const keys = ((r && r.keys) || []).filter(k=>{
    const d = k.replace('journal:','');
    return d >= from && d <= to;
  }).sort();

  let md = `# Decision Journal Export (${from} → ${to})\n\n`;
  for(const k of keys){
    let j;
    try{ const rr = await Storage.get(k); j = rr && rr.value ? JSON.parse(rr.value) : null; }catch(e){ continue; }
    if(!j) continue;
    md += `## ${j.date}\n`;
    md += `Mood: ${j.mood||'—'} | Energy: ${j.energy||'—'} | Location: ${j.location||'—'} | Weather: ${j.weather||'—'}\n`;
    md += `Goal: ${j.goal||'—'}\n\n`;
    (j.tasks||[]).forEach(t=>{
      md += `- **${t.name}** [${t.category}] — ${t.needWant||'?'}, priority ${t.priority||'?'}, status ${t.status||'?'}\n`;
      if(t.reason) md += `  reason: ${t.reason}\n`;
      if(t.estTime||t.estCost) md += `  est: ${t.estTime||'—'} / ${t.estCost||'—'}\n`;
      if(t.risks) md += `  risks: ${t.risks}\n`;
      if(t.outcome) md += `  outcome: ${t.outcome}\n`;
    });
    if(j.reflection) md += `\nReflection: ${j.reflection}\n`;
    md += `\n`;
  }

  const decisionsInRange = state.decisions.filter(d => (d.createdAt||'') >= from && (d.createdAt||'') <= to);
  if(decisionsInRange.length){
    md += `## Decisions\n`;
    decisionsInRange.forEach(d=>{
      md += `- **${d.decision}** (${d.createdAt}) — confidence ${d.confidence||'?'}/5\n`;
      if(d.context) md += `  context: ${d.context}\n`;
      if(d.pros) md += `  pros: ${d.pros}\n`;
      if(d.cons) md += `  cons: ${d.cons}\n`;
      if(d.actualOutcome) md += `  outcome: ${d.actualOutcome}\n`;
      if(d.lessons) md += `  lessons: ${d.lessons}\n`;
    });
    md += `\n`;
  }

  const ideasInRange = state.ideas.filter(i => (i.createdAt||'') >= from && (i.createdAt||'') <= to);
  if(ideasInRange.length){
    md += `## Ideas & Frustrations\n`;
    ideasInRange.forEach(i=>{
      md += `- [${i.type}] ${i.problem} (${i.frequency||'—'})\n`;
      if(i.notes) md += `  ${i.notes}\n`;
    });
    md += `\n`;
  }

  md += `---\n\n`;
  md += `## Analysis request\n`;
  md += `Please analyze the journal above and:\n`;
  md += `- Rate my productivity and highlight patterns\n`;
  md += `- Find recurring frustrations and manual work\n`;
  md += `- Find startup, automation, or business opportunities hiding in this data\n`;
  md += `- Flag expensive or unnecessary habits\n`;
  md += `- Point out decisions with the biggest impact, good or bad\n`;
  md += `- Suggest one small experiment I could run this week\n`;

  state.exportText = md;
  out.innerHTML = `
    <div class="card">
      <div style="display:flex; gap:8px; margin-bottom:10px;">
        <button onclick="copyExport()">Copy to clipboard</button>
        <button onclick="downloadExport()">Download .md</button>
      </div>
      <textarea class="export" readonly>${esc(md)}</textarea>
    </div>`;
}
function copyExport(){
  navigator.clipboard.writeText(state.exportText).then(()=>toast('Copied.')).catch(()=>toast('Copy failed — select and copy manually.'));
}
function downloadExport(){
  const blob = new Blob([state.exportText], {type:'text/markdown'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `journal-export-${todayStr()}.md`;
  a.click();
}

boot();
</script>
</body>
</html>
